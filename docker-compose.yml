services:
  # Servidor LiveKit WebRTC
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./livekit.production.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

  # Caddy: Proxy Reverso com SSL/HTTPS Automático (Let's Encrypt)
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}

volumes:
  caddy_data:
  caddy_config:
