services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.production.yaml:/etc/livekit.yaml
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    expose:
      - "7880"
    labels:
      - "coolify.managed=true"
      - "coolify.port=7880"
    ports:
      # Porta HTTP / WebSocket
      - "7880:7880"
      # Porta WebRTC TCP fallback
      - "7881:7881"
      # Portas WebRTC UDP para áudio e vídeo de baixa latência
      - "50000-50050:50000-50050/udp"
