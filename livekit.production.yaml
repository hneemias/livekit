# Arquivo de configuração de Produção para LiveKit Server
port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

# Configurações de logging
logging:
  level: info

# As chaves são injetadas automaticamente via variáveis de ambiente LIVEKIT_KEYS
